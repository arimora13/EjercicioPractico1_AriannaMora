<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Categoría</title>
    <meta charset="UTF-8">
</head>
<body>

<h1>Categoría</h1>

<form th:action="@{/categoria/guardar}" th:object="${categoria}" method="post">

    <input type="hidden" th:field="*{idCategoria}" />

    <label>Nombre:</label>
    <input type="text" th:field="*{nombreCategoria}" required />

    <br><br>
    <button type="submit">Guardar</button>
</form>

<br>
<a th:href="@{/categoria/listado}">Volver</a>

</body>
</html>
