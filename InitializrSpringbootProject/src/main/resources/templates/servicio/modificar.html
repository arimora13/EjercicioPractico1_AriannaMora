<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Servicio</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">

<h2>Servicio</h2>

<form th:action="@{/servicio/guardar}" th:object="${servicio}" method="post">

    <input type="hidden" th:field="*{idServicio}" />

    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" th:field="*{nombreServicio}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Precio</label>
        <input type="number" step="0.01" class="form-control" th:field="*{precioServicio}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Categoría</label>
        <select class="form-select" th:field="*{categoria}">
            <option th:each="cat : ${categorias}"
                    th:value="${cat.idCategoria}"
                    th:text="${cat.nombreCategoria}">
            </option>
        </select>
    </div>

    <button type="submit" class="btn btn-success">Guardar</button>
    <a th:href="@{/servicio/listado}" class="btn btn-secondary">Volver</a>

</form>

</body>
</html>
