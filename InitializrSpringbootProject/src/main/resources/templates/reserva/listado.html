<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Reservas - Salón Glamour</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        :root {
            --rosa:  #c4808e;
            --vino:  #7a3048;
            --oro:   #c9a84c;
            --creme: #faf6f1;
        }

        body {
            font-family: 'Jost', sans-serif;
            background-color: var(--creme);
        }

        /* NAVBAR */
        .navbar {
            background: linear-gradient(135deg, #1a1a1a 0%, #3a1525 100%) !important;
            border-bottom: 2px solid var(--oro);
            padding: 14px 32px;
        }
        .navbar-brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            letter-spacing: 2px;
            color: #fff !important;
        }
        .navbar-brand span { color: var(--oro); }

        .btn-outline-light {
            border-color: rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.85);
            font-size: 0.8rem;
            letter-spacing: 1px;
            font-weight: 400;
            transition: all 0.25s;
        }
        .btn-outline-light:hover {
            background: rgba(255,255,255,0.12);
            border-color: var(--oro);
            color: var(--oro);
        }
        .btn-warning-nav {
            background: var(--oro) !important;
            border-color: var(--oro) !important;
            color: #1a1a1a !important;
            font-size: 0.8rem;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* PAGE HEADER */
        .page-header {
            background: linear-gradient(135deg, #1a1a1a 0%, var(--vino) 60%, #c4808e 100%);
            color: white;
            padding: 48px 20px;
            text-align: center;
            margin-bottom: 40px;
        }
        .page-header h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.6rem;
            font-weight: 400;
            margin-bottom: 6px;
        }
        .page-header h2 em { font-style: italic; color: var(--oro); }
        .page-header-divider {
            width: 50px;
            height: 2px;
            background: var(--oro);
            margin: 12px auto 0;
        }

        /* TABLA */
        .tabla-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 1px solid rgba(201,168,76,0.15);
        }

        .tabla-card-header {
            background: linear-gradient(135deg, #1a1a1a, #3a1525);
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .tabla-card-header span {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            color: #fff;
            letter-spacing: 1px;
        }

        .btn-nueva {
            background: var(--oro);
            border: none;
            color: #1a1a1a;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            padding: 8px 20px;
            border-radius: 6px;
            text-decoration: none;
            transition: filter 0.2s;
        }
        .btn-nueva:hover { filter: brightness(1.1); color: #1a1a1a; }

        table { margin: 0; }

        thead th {
            background: rgba(122,48,72,0.07);
            color: var(--vino);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 2px solid rgba(201,168,76,0.3) !important;
            padding: 14px 20px;
        }

        tbody tr { transition: background 0.15s; }
        tbody tr:hover { background-color: #fdf5f0; }

        tbody td {
            padding: 14px 20px;
            font-size: 0.95rem;
            font-weight: 300;
            color: #444;
            vertical-align: middle;
            border-color: #f0ece8;
        }

        .badge-id {
            background: rgba(201,168,76,0.15);
            color: var(--vino);
            font-size: 0.78rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .badge-fecha {
            background: rgba(100,149,237,0.1);
            color: #2a4a8a;
            font-size: 0.82rem;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(100,149,237,0.2);
        }

        .badge-servicio {
            background: rgba(122,48,72,0.08);
            color: var(--vino);
            font-size: 0.78rem;
            font-weight: 500;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(122,48,72,0.15);
        }

        .cliente-nombre {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .cliente-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--vino), var(--rosa));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 0.72rem;
            font-weight: 600;
            flex-shrink: 0;
        }

        .btn-editar {
            background: rgba(201,168,76,0.15);
            color: #7a5500;
            border: none;
            font-size: 0.78rem;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-editar:hover { background: var(--oro); color: #1a1a1a; }

        .btn-eliminar {
            background: rgba(196,128,142,0.12);
            color: var(--vino);
            border: none;
            font-size: 0.78rem;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-eliminar:hover { background: var(--vino); color: #fff; }

        .btn-volver {
            background: transparent;
            border: 1.5px solid var(--vino);
            color: var(--vino);
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 1px;
            padding: 9px 22px;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-volver:hover { background: var(--vino); color: #fff; }

        /* FOOTER */
        footer {
            background: linear-gradient(135deg, #1a1a1a 0%, #3a1525 100%);
            border-top: 2px solid var(--oro);
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            padding: 18px;
            text-align: center;
            margin-top: 60px;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Salón <span>Glamour</span></a>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-light" th:href="@{/categoria/listado}">
                <i class="fa fa-tags me-1"></i>Categorías
            </a>
            <a class="btn btn-outline-light" th:href="@{/servicio/listado}">
                <i class="fa fa-scissors me-1"></i>Servicios
            </a>
            <a class="btn btn-outline-light" th:href="@{/reserva/listado}">
                <i class="fa fa-calendar-check me-1"></i>Reservas
            </a>
            <a class="btn btn-warning-nav btn-outline-light" th:href="@{/queja/formulario}">
                <i class="fa fa-comment me-1"></i>Quejas
            </a>
        </div>
    </div>
</nav>

<!-- PAGE HEADER -->
<div class="page-header">
    <h2><i class="fa fa-calendar-check me-2" style="color: var(--oro);"></i>Gestión de <em>Reservas</em></h2>
    <div class="page-header-divider"></div>
</div>

<!-- CONTENIDO -->
<div class="container mb-5">
    <div class="tabla-card">
        <div class="tabla-card-header">
            <span><i class="fa fa-list me-2" style="color: var(--oro);"></i>Lista de Reservas</span>
            <a th:href="@{/reserva/nuevo}" class="btn-nueva">
                <i class="fa fa-plus me-1"></i> Nueva Reserva
            </a>
        </div>
        <table class="table table-borderless mb-0">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th>Servicio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="res : ${reservas}">
                    <td><span class="badge-id" th:text="${res.idReserva}"></span></td>
                    <td>
                        <span class="badge-fecha">
                            <i class="fa fa-calendar me-1"></i>
                            <span th:text="${res.fechaReserva}"></span>
                        </span>
                    </td>
                    <td>
                        <div class="cliente-nombre">
                            <div class="cliente-avatar">
                                <i class="fa fa-user"></i>
                            </div>
                            <span th:text="${res.nombreCliente}"></span>
                        </div>
                    </td>
                    <td><span class="badge-servicio" th:text="${res.servicio.nombreServicio}"></span></td>
                    <td class="d-flex gap-2">
                        <a th:href="@{/reserva/editar/{id}(id=${res.idReserva})}" class="btn-editar">
                            <i class="fa fa-edit me-1"></i>Editar
                        </a>
                        <a th:href="@{/reserva/eliminar/{id}(id=${res.idReserva})}"
                           class="btn-eliminar"
                           onclick="return confirm('¿Deseas eliminar esta reserva?')">
                            <i class="fa fa-trash me-1"></i>Eliminar
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(reservas)}">
                    <td colspan="5" class="text-center py-4" style="color:#aaa; font-style:italic;">
                        No hay reservas registradas aún.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-4">
        <a th:href="@{/}" class="btn-volver">
            <i class="fa fa-arrow-left me-1"></i> Volver al Inicio
        </a>
    </div>
</div>

<!-- FOOTER -->
<footer>
    <i class="fa fa-star" style="color: var(--oro); font-size:0.65rem;"></i>
    © 2026 Salón Belleza Glamour
    <i class="fa fa-star" style="color: var(--oro); font-size:0.65rem;"></i>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
