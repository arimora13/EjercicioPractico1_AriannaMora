<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quejas y Sugerencias - Salón Glamour</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <style>
        :root {
            --rosa:  #c4808e;
            --vino:  #7a3048;
            --oro:   #c9a84c;
            --creme: #faf6f1;
        }

        body {
            font-family: 'Jost', sans-serif;
            background-color: var(--creme);
        }

        /* NAVBAR */
        .navbar {
            background: linear-gradient(135deg, #1a1a1a 0%, #3a1525 100%) !important;
            border-bottom: 2px solid var(--oro);
            padding: 14px 32px;
        }
        .navbar-brand {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            letter-spacing: 2px;
            color: #fff !important;
        }
        .navbar-brand span { color: var(--oro); }

        .btn-outline-light {
            border-color: rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.85);
            font-size: 0.8rem;
            letter-spacing: 1px;
            font-weight: 400;
            transition: all 0.25s;
        }
        .btn-outline-light:hover {
            background: rgba(255,255,255,0.12);
            border-color: var(--oro);
            color: var(--oro);
        }
        .btn-warning-nav {
            background: var(--oro) !important;
            border-color: var(--oro) !important;
            color: #1a1a1a !important;
            font-size: 0.8rem;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* PAGE HEADER */
        .page-header {
            background: linear-gradient(135deg, #1a1a1a 0%, var(--vino) 60%, #c4808e 100%);
            color: white;
            padding: 48px 20px;
            text-align: center;
            margin-bottom: 40px;
        }
        .page-header h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.6rem;
            font-weight: 400;
            margin-bottom: 6px;
        }
        .page-header h2 em { font-style: italic; color: var(--oro); }
        .page-header-divider {
            width: 50px;
            height: 2px;
            background: var(--oro);
            margin: 12px auto 0;
        }

        /* FORM CARD */
        .form-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 1px solid rgba(201,168,76,0.15);
            max-width: 620px;
            margin: 0 auto;
        }

        .form-card-header {
            background: linear-gradient(135deg, #1a1a1a, #3a1525);
            padding: 18px 28px;
        }
        .form-card-header span {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            color: #fff;
            letter-spacing: 1px;
        }
        .form-card-header p {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            margin: 4px 0 0;
            font-weight: 300;
        }

        .form-card-body { padding: 32px 28px; }

        .form-label {
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--vino);
            margin-bottom: 6px;
        }

        .form-control {
            border: 1.5px solid #e8ddd5;
            border-radius: 6px;
            font-family: 'Jost', sans-serif;
            font-size: 0.92rem;
            font-weight: 300;
            color: #333;
            padding: 10px 14px;
            background: #fdfaf8;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            border-color: var(--oro);
            box-shadow: 0 0 0 3px rgba(201,168,76,0.15);
            background: #fff;
            outline: none;
        }

        textarea.form-control { resize: vertical; min-height: 120px; }

        .btn-enviar {
            background: linear-gradient(135deg, var(--vino), var(--rosa));
            color: #fff;
            border: none;
            font-family: 'Jost', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 12px 32px;
            border-radius: 6px;
            transition: filter 0.2s, transform 0.2s;
            cursor: pointer;
        }
        .btn-enviar:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .btn-volver {
            background: transparent;
            border: 1.5px solid var(--vino);
            color: var(--vino);
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 1px;
            padding: 9px 22px;
            border-radius: 6px;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-volver:hover { background: var(--vino); color: #fff; }

        /* FOOTER */
        footer {
            background: linear-gradient(135deg, #1a1a1a 0%, #3a1525 100%);
            border-top: 2px solid var(--oro);
            color: rgba(255,255,255,0.6);
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            padding: 18px;
            text-align: center;
            margin-top: 60px;
        }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Salón <span>Glamour</span></a>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-light" th:href="@{/categoria/listado}">
                <i class="fa fa-tags me-1"></i>Categorías
            </a>
            <a class="btn btn-outline-light" th:href="@{/servicio/listado}">
                <i class="fa fa-scissors me-1"></i>Servicios
            </a>
            <a class="btn btn-outline-light" th:href="@{/reserva/listado}">
                <i class="fa fa-calendar-check me-1"></i>Reservas
            </a>
            <a class="btn btn-warning-nav btn-outline-light" th:href="@{/queja/formulario}">
                <i class="fa fa-comment me-1"></i>Quejas
            </a>
        </div>
    </div>
</nav>

<!-- PAGE HEADER -->
<div class="page-header">
    <h2><i class="fa fa-comment-dots me-2" style="color: var(--oro);"></i>Quejas y <em>Sugerencias</em></h2>
    <div class="page-header-divider"></div>
</div>

<!-- FORMULARIO -->
<div class="container mb-5">
    <div class="form-card">
        <div class="form-card-header">
            <span><i class="fa fa-paper-plane me-2" style="color: var(--oro);"></i>Envíanos tu Mensaje</span>
            <p>Responderemos a la brevedad posible</p>
        </div>
        <div class="form-card-body">
            <form th:action="@{/queja/guardar}" th:object="${queja}" method="post">

                <div class="mb-3">
                    <label class="form-label"><i class="fa fa-user me-1"></i> Nombre</label>
                    <input type="text" class="form-control" th:field="*{nombre}"
                           placeholder="Tu nombre completo" required/>
                </div>

                <div class="mb-3">
                    <label class="form-label"><i class="fa fa-envelope me-1"></i> Correo Electrónico</label>
                    <input type="email" class="form-control" th:field="*{correo}"
                           placeholder="tu@correo.com" required/>
                </div>

                <div class="mb-4">
                    <label class="form-label"><i class="fa fa-comment me-1"></i> Mensaje</label>
                    <textarea class="form-control" th:field="*{mensaje}"
                              placeholder="Escribe tu queja o sugerencia aquí..." required></textarea>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <a th:href="@{/}" class="btn-volver">
                        <i class="fa fa-arrow-left me-1"></i> Volver
                    </a>
                    <button type="submit" class="btn-enviar">
                        <i class="fa fa-paper-plane me-1"></i> Enviar Mensaje
                    </button>
                </div>

            </form>
        </div>
    </div>
</div>

<!-- FOOTER -->
<footer>
    <i class="fa fa-star" style="color: var(--oro); font-size:0.65rem;"></i>
    © 2026 Salón Belleza Glamour
    <i class="fa fa-star" style="color: var(--oro); font-size:0.65rem;"></i>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
