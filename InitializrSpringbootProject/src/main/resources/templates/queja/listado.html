<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Listado Quejas</title>
    <meta charset="UTF-8">
</head>
<body>
<h1>Listado de Quejas y Sugerencias</h1>
<table border="1">
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Correo</th>
        <th>Mensaje</th>
    </tr>
    <tr th:each="q : ${quejas}">
        <td th:text="${q.idQueja}"></td>
        <td th:text="${q.nombre}"></td>
        <td th:text="${q.correo}"></td>
        <td th:text="${q.mensaje}"></td>
    </tr>
</table>
<br>
<a th:href="@{/}">Volver</a>
</body>
</html>
